scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.15
        upper_threshold: 10.0
        lower_replacement_value: .inf
        upper_replacement_value: .inf
        
    filter2:
      name: my_polygon_filter
      type: laser_filters/LaserScanPolygonFilter
      params:
        polygon_frame: base_footprint
        # Lidar at (-0.327, 0.545), facing -x (rotated 180°).
        # Self-hits at 0.25m forward land at x≈-0.58, y≈0.54.
        # Box covers the robot body in the lidar's forward arc.
        polygon: "[[-0.25, 0.70], [-0.65, 0.70], [-0.65, 0.35], [-0.25, 0.35]]"
        polygon_padding: 0.02
        invert: false