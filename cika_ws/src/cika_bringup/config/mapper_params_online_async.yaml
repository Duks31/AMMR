# Saving the map: ros2 run nav2_map_server map_saver_cli -f ~/cika_maps/cika_map

slam_toolbox:
  ros__parameters:
    # ── Solver Parameters ─────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Frame IDs and Core ROS 2 Settings ─────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint  # Matches your updated URDF
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # ── Performance and Update Rates ──────────────────────────────────────────
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02  # Publishes map -> odom TF at 50Hz to match your EKF
    map_update_interval: 1.0        # 1-second map updates (laptop CPU can easily handle this)
    resolution: 0.05                # 5cm grid cells

    # ── RPLiDAR-Specific Tuning ───────────────────────────────────────────────
    max_laser_range: 12.0           # Matches the max reliable range from your previous RTAB-Map config
    minimum_time_interval: 0.1      # Expects a scan roughly every 0.1s (10Hz)
    transform_timeout: 0.2
    tf_buffer_duration: 5.0 
    stack_size_to_use: 40000000     # 40MB memory allocation for Ceres

    # ── Scan Matching and Loop Closure ────────────────────────────────────────
    enable_interactive_mode: true
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2    # Update map after 20cm of translation
    minimum_travel_heading: 0.2     # Update map after ~11 degrees of rotation
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    # ── Correlation Parameters ────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Penalties and Variances ───────────────────────────────────────────────
    distance_variance_penalty: 0.8
    angle_variance_penalty: 1.0    
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349 
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true