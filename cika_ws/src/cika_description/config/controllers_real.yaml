# use_sim_time is set to false for all controllers, as they will be used in real hardware and not in simulation.
# to run in simulation, set use_sim_time to true for all controllers and make sure to launch the controller_manager with the appropriate parameter file that has use_sim_time set to true.

controller_manager:
  ros__parameters:
    use_sim_time: false
    update_rate: 100 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # skid_steer_controller:
    #   type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false
    joints:
      - turntable_1_joint
      - lower_arm_1_joint
      - center_arm_1_joint
      - upper_arm_1_joint
      - gripper_mount_1_joint
      - left_gripper_1_joint

skid_steer_controller:
  ros__parameters:
    left_wheel_names: ["left_front_wheel_1_joint", "left_back_wheel_1_joint"]
    right_wheel_names: ["right_front_wheel_1_joint", "right_back_wheel_1_joint"]
    wheel_separation: 0.363
    wheel_radius: 0.0889
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    open_loop: false
    enable_odom_tf: false #  EKF from robot_localization will publish the odom->base_link transform
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    use_sim_time: false
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.12
        has_acceleration_limits: true
        max_acceleration: 0.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 0.66
        has_acceleration_limits: true
        max_acceleration: 1.0

arm_controller:
  ros__parameters:
    joints:
      - turntable_1_joint
      - lower_arm_1_joint
      - center_arm_1_joint
      - upper_arm_1_joint
      - gripper_mount_1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true
    allow_integration_in_goal_trajectories: true

gripper_controller:
  ros__parameters:
    joints:
      - left_gripper_1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
